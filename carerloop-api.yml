  /api/v1/organisations/{organisationPublicId}/care-homes/{careHomePublicId}/assistance/{requestPublicId}/reassign:
    post:
      tags:
      - Assistance Management
      summary: Reassign assistance request
      description: |
        Reassigns an acknowledged or responding assistance request
        to another active staff member within the same care home.

        Access is restricted to:
        - Super Administrators
        - System Administrators
        - Organisation Administrators assigned to the organisation
        - Care Home Administrators assigned to the care home
        - Care Home Managers assigned to the care home

        The request status remains unchanged after reassignment.
        The previous assignment, new assignment, supervisor and
        reassignment reason are recorded in assignment history.

        The target staff member must have an active role assignment
        within the specified organisation and care home.
      operationId: reassign
      parameters:
      - name: organisationPublicId
        in: path
        description: Public UUID of the organisation
        required: true
        schema:
          type: string
          format: uuid
      - name: careHomePublicId
        in: path
        description: Public UUID of the care home
        required: true
        schema:
          type: string
          format: uuid
      - name: requestPublicId
        in: path
        description: Public UUID of the assistance request
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: New staff assignment and reason for reassignment
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignAssistanceRequest"
        required: true
      responses:
        "200":
          description: Assistance request successfully reassigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistanceResponse"
        "400":
          description: Invalid reassignment request or inactive staff member
        "401":
          description: Authentication required
        "403":
          description: User does not have permission to reassign assistance requests
        "404":
          description: "Organisation, care home, request or staff member not found"
        "409":
          description: Request cannot be reassigned in its current status
